<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salesforce試験対策</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<style>
  /* 雑誌の表紙風。白地・濃紺の文字・青のアクセントだけで、大きな見出しと余白で見せる。ダークモードなし。 */
:root {
  --bg: #fff;
  --sf: #fff;
  --tint: #f4f7fd;
  --ink: #0f1b3d;
  --mu: #4a5578;
  --ac: #1d4ed8;
  --pb: #1d4ed8;
  --sky: #38bdf8;
  --ok: #0f7a55;
  --ng: #c0304a;
  --wn: #9a6700;
  --ln: #dbe3f4;
  --grad: linear-gradient(90deg, #1d4ed8, #38bdf8);
  --fb: Meiryo, "Hiragino Sans", "Noto Sans JP", sans-serif;
  --fd: Meiryo, "Hiragino Sans", "Noto Sans JP", sans-serif;
  color-scheme: light;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.8 var(--fb);
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--bg);
}
main {
  max-width: 720px;
  margin: 0 auto;
  padding-block: 0 calc(140px + env(safe-area-inset-bottom, 0px));
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
}
h1 {
  font: 800 42px/1.15 var(--fd);
  margin: 0;
  letter-spacing: 0.01em;
  text-wrap: balance;
}
h2 {
  font: 800 28px/1.25 var(--fd);
  margin: 0;
}
h3 {
  font: 800 15px/1.5 var(--fd);
}
p {
  margin: 0;
}
/* 英字の小見出し */
.eb {
  display: block;
  font: 800 11px/1.4 var(--fd);
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--ac);
  margin: 0 0 10px;
}
.eb.g {
  color: var(--mu);
}
/* 見出し下の短いグラデーション線（グラデーションはこの線とメインボタンだけ） */
.rule {
  display: block;
  width: 96px;
  height: 6px;
  border-radius: 3px;
  background: var(--grad);
  margin: 18px 0 20px;
}
/* 誌名ヘッダー */
.mast {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  padding: 18px 0 12px;
  border-bottom: 1px solid var(--ln);
  font: 800 11px/1.4 var(--fd);
  letter-spacing: 0.22em;
  color: var(--mu);
}
.mast b {
  color: var(--ink);
  font-weight: 800;
}
.cover {
  padding: 32px 0 4px;
}
/* 情報ボックス */
.card {
  background: var(--sf);
  border: 1px solid var(--ln);
  border-radius: 16px;
  padding: 20px;
  margin: 28px 0;
}
.card h2 {
  font-size: 22px;
  line-height: 1.35;
}
.sec {
  margin: 44px 0 28px;
}
.sec[hidden] {
  display: none;
}
.home-grid .col {
  min-width: 0;
}
.home-grid .col > .card,
.home-grid .col > .sec {
  margin-block: 28px;
}
button {
  font: inherit;
  font-weight: 700;
  min-height: 48px;
  border-radius: 12px;
  border: 1px solid var(--ln);
  background: var(--sf);
  color: var(--ink);
  padding: 0 14px;
  cursor: pointer;
}
button:focus-visible,
input:focus-visible,
select:focus-visible {
  outline: 3px solid var(--ac);
  outline-offset: 2px;
}
button:disabled {
  opacity: 0.45;
  cursor: default;
}
button.p {
  background: var(--ac);
  color: #fff;
  border-color: var(--ac);
}
/* メインボタン */
button.go,
#go {
  display: block;
  width: 100%;
  height: 56px;
  min-height: 56px;
  border: 0;
  border-radius: 999px;
  background: var(--grad);
  color: #fff;
  font-weight: 800;
  font-size: 16px;
  letter-spacing: 0.08em;
  margin: 28px 0 12px;
}
button.go2 {
  background: var(--ink);
  margin: 0 0 8px;
}
button.go2:disabled {
  opacity: 0.4;
}
input,
textarea,
select {
  font: inherit;
  min-height: 44px;
  width: 100%;
  border: 1px solid var(--ln);
  border-radius: 12px;
  background: var(--bg);
  color: var(--ink);
  padding: 6px 12px;
}
input[type="checkbox"] {
  accent-color: var(--ac);
}
label {
  display: block;
  font-size: 13px;
  color: var(--mu);
}
.row {
  display: flex;
  gap: 8px;
  margin: 10px 0;
}
.row > * {
  flex: 1;
  min-width: 0;
}
.row > button {
  padding: 0 6px;
  font-size: 14px;
  line-height: 1.3;
}
.mu {
  color: var(--mu);
  font-size: 14px;
  margin: 8px 0;
}
.opt {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 14px;
  border: 1px solid var(--ln);
  border-radius: 12px;
  margin: 10px 0;
  background: var(--sf);
  cursor: pointer;
}
.opt b {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 1px solid var(--ln);
  color: var(--ac);
  display: grid;
  place-items: center;
  flex: none;
  font: 800 13px var(--fd);
}
.opt span {
  min-width: 0;
  overflow-wrap: anywhere;
}
.opt.sel {
  border-color: var(--ac);
  box-shadow: inset 0 0 0 1px var(--ac);
}
.opt.sel b {
  background: var(--ac);
  border-color: var(--ac);
  color: #fff;
}
.opt.ok {
  border-color: var(--ok);
  box-shadow: inset 0 0 0 1px var(--ok);
}
.opt.ok b {
  background: var(--ok);
  border-color: var(--ok);
  color: #fff;
}
.opt.ng {
  border-color: var(--ng);
}
.bar {
  position: relative;
  height: 10px;
  background: var(--ln);
  border-radius: 5px;
  overflow: hidden;
}
.bar i {
  display: block;
  height: 100%;
  background: var(--ac);
  width: 0;
  border-radius: 3px;
}
.bar u {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--ink);
}
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  background: var(--bg);
  padding: 12px 0;
  border-bottom: 1px solid var(--ln);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  z-index: 2;
  font: 800 15px var(--fd);
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(46px, 1fr));
  gap: 6px;
}
.grid button {
  min-height: 44px;
  padding: 0;
}
.grid .dn {
  background: var(--ac);
  border-color: var(--ac);
  color: #fff;
}
/* フラグ：右上の角に橙の三角。回答済み（青）でも未回答（白）でも見える */
.grid .fl {
  position: relative;
  overflow: hidden;
  border-color: #e08a00;
  border-width: 2px;
}
.grid .fl::after {
  content: "";
  position: absolute;
  top: 0;
  right: 0;
  border-style: solid;
  border-width: 0 16px 16px 0;
  border-color: transparent #e08a00 transparent transparent;
}
.grid .fl:not(.dn) {
  background: #fff4dc;
}
/* 数字の強調：数字は大きく、単位は小さく */
.big {
  font: 800 40px/1.1 var(--fd);
  font-variant-numeric: tabular-nums;
}
.big small,
.pc small {
  font: 700 14px var(--fd);
  margin-left: 3px;
  color: var(--mu);
}
.ex {
  background: var(--tint);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 15px;
  white-space: pre-wrap;
}
/* 表紙のバッジ */
.bd {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 4px;
}
.bd p {
  flex-basis: 100%;
  font-size: 12px;
  color: var(--mu);
  margin-top: 6px;
}
.pill {
  display: inline-block;
  border: 1px solid var(--ac);
  color: var(--ac);
  border-radius: 99px;
  padding: 0 12px;
  font: 800 12px/24px var(--fd);
}
.dm {
  margin: 18px 0;
}
.dm .hd {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 14px;
  margin-bottom: 6px;
}
.dm .hd span {
  min-width: 0;
  overflow-wrap: anywhere;
}
.dm .hd b {
  font: 800 16px var(--fd);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.dm small.wt {
  white-space: nowrap;
  color: var(--mu);
  font-size: 11px;
  margin-left: 4px;
}
.dm small {
  font: 400 12px var(--fb);
  color: var(--mu);
}
input[type="date"] {
  -webkit-appearance: none;
  appearance: none;
  display: block;
  min-width: 0;
  max-width: 100%;
  width: 100%;
  text-align: left;
}
.sub {
  border: 1px solid var(--ln);
  border-radius: 12px;
  padding: 14px;
  margin-top: 16px;
}
.sub h3 {
  margin: 0 0 4px;
}
/* 目次風の一覧：青い番号、罫線で区切る、先頭の罫線だけ濃紺 */
.toc {
  counter-reset: n;
}
.gl {
  font: 800 11px/1.4 var(--fd);
  letter-spacing: 0.22em;
  color: var(--mu);
  margin: 24px 0 8px;
}
.mi {
  border-top: 1px solid var(--ln);
  counter-increment: n;
}
.toc .mi:first-of-type {
  border-top: 1px solid var(--ink);
}
.mh {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 0;
}
.toc .mh::before {
  content: counter(n, decimal-leading-zero);
  flex: none;
  width: 30px;
  color: var(--ac);
  font: 800 18px var(--fd);
  font-variant-numeric: tabular-nums;
}
.mt {
  flex: 1;
  min-width: 0;
}
.mt b {
  font: 800 15px/1.5 var(--fd);
  display: block;
}
.mt small {
  display: block;
  color: var(--mu);
  font-size: 12px;
  line-height: 1.5;
}
.mh .pc {
  flex: none;
  font: 800 28px/1 var(--fd);
  font-variant-numeric: tabular-nums;
}
.ma {
  display: flex;
  gap: 6px;
  flex: none;
}
.ma button {
  min-width: 72px;
}
.inf {
  width: 32px;
  height: 32px;
  min-height: 32px;
  padding: 0;
  border-radius: 50%;
  flex: none;
  font: 800 14px var(--fd);
  color: var(--mu);
}
.inf[aria-expanded="true"] {
  background: var(--ac);
  color: #fff;
  border-color: var(--ac);
}
/* 開閉する領域（説明の「i」、問題データのアコーディオン）。閉じている間はキーボードの対象にしない。 */
.if,
.acc-b {
  display: grid;
  grid-template-rows: 0fr;
  opacity: 0;
  visibility: hidden;
  transition:
    grid-template-rows 0.25s ease,
    opacity 0.25s ease,
    visibility 0s linear 0.25s;
}
.if.on,
.acc-b.on {
  grid-template-rows: 1fr;
  opacity: 1;
  visibility: visible;
  transition-delay: 0s;
}
.acc-b > div {
  overflow: hidden;
  min-height: 0;
  padding: 2px;
  margin: -2px;
}
.if > div {
  overflow: hidden;
  min-height: 0;
}
.if p {
  margin: 0 0 12px;
  padding: 12px 14px;
  background: var(--tint);
  border-radius: 12px;
  font-size: 14px;
  color: var(--mu);
}
@media (prefers-reduced-motion: reduce) {
  .if,
  .acc-b,
  .chev {
    transition: none;
  }
}
/* アコーディオン（問題データ） */
.acc-h {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 44px;
  padding: 0;
  border: 0;
  background: none;
  text-align: left;
  font: 800 22px/1.35 var(--fd);
}
.acc-h b {
  flex: 1;
  display: block;
}
.chev {
  width: 10px;
  height: 10px;
  margin: 0 6px 4px 0;
  border-right: 2.5px solid var(--mu);
  border-bottom: 2.5px solid var(--mu);
  transform: rotate(45deg);
  transition: transform 0.25s ease;
}
.acc-h[aria-expanded="true"] .chev {
  transform: rotate(-135deg) translate(-2px, -2px);
}
@media (hover: hover) {
  button:not(:disabled):hover {
    border-color: var(--ac);
  }
  button.p:not(:disabled):hover {
    filter: brightness(1.1);
  }
  #go:not(:disabled):hover {
    filter: brightness(1.06);
  }
}
@media (max-width: 360px) {
  h1 {
    font-size: 38px;
  }
}
.hero {
  padding: 32px 0 4px;
}
.hero h1 {
  font-size: 34px;
}
.hero h1::after {
  content: "";
  display: block;
  width: 96px;
  height: 6px;
  border-radius: 3px;
  background: var(--grad);
  margin: 16px 0 20px;
}
.hero p {
  color: var(--mu);
  margin-top: 6px;
}
@media (max-width: 480px) {
  label > small.mu {
    display: none;
  }
}

/* 長いURLやコードが、枠からはみ出さないようにする */
.card,
.card p,
.ex,
.opt span {
  overflow-wrap: anywhere;
  word-break: break-word;
}
.card a,
.ex a,
.opt a {
  color: var(--ac);
  text-decoration: underline;
  text-underline-offset: 2px;
}

/* オプション欄（枠で囲む） */
.optbox {
  margin: 16px -12px 0;
  padding: 0 16px;
  border: 1px solid var(--ln);
  border-radius: 16px;
}
.optbox .acc-b > div {
  padding: 6px 6px 22px;
  margin: -6px;
}

/* オプションの見出し：題名と矢印を1行に、有効な設定は次の行にタグで並べる */
.optbox .acc-h {
  flex-wrap: wrap;
  row-gap: 0;
  padding: 6px 0;
}
.optbox .acc-h b {
  flex: 1 1 auto;
  white-space: nowrap;
}
#os {
  order: 3;
  flex: 1 0 100%;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding-bottom: 8px;
}
#os:empty {
  display: none;
}
.tg {
  border: 1px solid var(--ac);
  color: var(--ac);
  border-radius: 999px;
  padding: 1px 10px;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}

</style>
<main id="app"></main>
<script>
  "use strict";
(() => {
  // src/exams.ts
  var DEFAULT_EXAMS = {
    "Salesforce 認定 Platform アドミニストレーター": {
      n: 60,
      m: 105,
      p: 65,
      note: "合格ラインは日本語版65%（英語版68%）。Summer '25対応の公式ガイドです。",
      d: [
        ["Configuration and Setup", 15],
        ["Object Manager and Lightning App Builder", 15],
        ["Sales and Marketing Applications", 10],
        ["Service and Support Applications", 10],
        ["Productivity and Collaboration", 10],
        ["Data and Analytics Management", 17],
        ["Automation", 15],
        ["Agentforce", 8]
      ],
      dj: {
        "Configuration and Setup": "設定とセットアップ",
        "Object Manager and Lightning App Builder": "オブジェクトマネージャーとLightningアプリケーションビルダー",
        "Sales and Marketing Applications": "営業・マーケティングアプリケーション",
        "Service and Support Applications": "サービス・サポートアプリケーション",
        "Productivity and Collaboration": "生産性とコラボレーション",
        "Data and Analytics Management": "データとアナリティクスの管理",
        Automation: "自動化",
        Agentforce: "Agentforce"
      }
    },
    "Salesforce 認定 Platform アプリケーションビルダー": {
      n: 60,
      m: 105,
      p: 73,
      note: "Summer '26対応の公式ガイドです（合格ライン73%）。",
      d: [
        ["Salesforce Fundamentals", 18],
        ["Data Modeling and Management", 20],
        ["Business Logic and Process Automation", 32],
        ["User Interface", 17],
        ["App Deployment", 13]
      ],
      dj: {
        "Salesforce Fundamentals": "Salesforceの基礎",
        "Data Modeling and Management": "データモデリングと管理",
        "Business Logic and Process Automation": "ビジネスロジックとプロセスの自動化",
        "User Interface": "ユーザーインターフェース",

      }
    },
    "Salesforce 認定 B2C Commerce デベロッパー": {
      n: 60,
      m: 105,
      p: 65,
      note: "Spring '23対応の公式ガイドです。",
      d: [
        ["B2C Commerce Setup", 11],
        ["Work With a B2C Site", 12],
        ["Data Management Using Business Manager Usage", 24],
        ["Application Development", 53]
      ],
      dj: {
        "B2C Commerce Setup": "B2C Commerceのセットアップ",
        "Work With a B2C Site": "B2Cサイトの操作",
        "Data Management Using Business Manager Usage": "Business Managerによるデータ管理",
        "Application Development": "アプリケーション開発"
      }
    },
    "Salesforce 認定 Platform デベロッパー": {
      n: 60,
      m: 105,
      p: 68,
      note: "Summer '25対応の公式ガイドです。",
      d: [
        ["Developer Fundamentals", 27],
        ["Process Automation and Logic", 28],
        ["User Interface", 25],
        ["Testing, Debugging, and Deployment", 20]
      ],
      dj: {
        "Developer Fundamentals": "デベロッパーの基礎",
        "Process Automation and Logic": "プロセスの自動化とロジック",
        "User Interface": "ユーザーインターフェース",
        "Testing, Debugging, and Deployment": "テスト・デバッグ・デプロイ"
      }
    }
  };
  var JA = {};
  var indexDomains = (exams) => {
    JA = {};
    for (const k in exams) Object.assign(JA, exams[k].dj || {});
  };
  var domJa = (name) => JA[name] || name;
  var EXAM_ALIAS = {
    Platformアドミニストレーター: "Salesforce 認定 Platform アドミニストレーター",
    "Platform App Builder": "Salesforce 認定 Platform アプリケーションビルダー",
    Platformデベロッパー: "Salesforce 認定 Platform デベロッパー"
  };
  var canonExam = (name) => EXAM_ALIAS[name] || name;

  // src/util.ts
  var $ = (selector) => document.querySelector(selector);
  var HTML_ESCAPES = {
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;"
  };
  var esc = (s) => String(s).replace(/[&<>"]/g, (c) => HTML_ESCAPES[c]);
  var rich = (s) => esc(s).replace(
    /https?:\/\/(?:(?!&quot;|&lt;|&gt;)[^\s"'<>()）」、。])+/g,
    (u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`
  );
  var fmt = (sec) => {
    const s = Math.max(0, sec);
    return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  };
  var L5 = "ABCDE";
  var shuffled = (a) => a.slice().sort(() => Math.random() - 0.5);

  // src/charts.ts
  var dbars = (dm, p, all, w) => {
    const known = all || [];
    const domains = [...known, ...Object.keys(dm || {}).filter((d) => !known.includes(d))];
    if (!domains.length) return '<p class="mu">まだデータがありません。</p>';
    const ix = (d) => w && w[d] ? `<small class="wt">出題${w[d]}%</small> ` : "";
    const line = (d) => {
      const v = dm && dm[d];
      if (!v || !v[1]) {
        return `<div class="dm"><div class="hd"><span>${esc(domJa(d))} ${ix(d)}</span><b style="color:var(--mu)"><small>未回答</small></b></div><div class="bar"><u style="left:${p}%"></u></div></div>`;
      }
      const pc = v[0] / v[1] * 100;
      const c = pc >= p ? "--ok" : pc >= p - 15 ? "--wn" : "--ng";
      return `<div class="dm"><div class="hd"><span>${esc(domJa(d))} ${ix(d)}</span><b style="color:var(${c})">${Math.round(pc)}%<small> ${v[0]}/${v[1]}</small></b></div><div class="bar"><i style="width:${pc}%;background:var(${c})"></i><u style="left:${p}%"></u></div></div>`;
    };
    return domains.map(line).join("") + `<p class="mu">縦線は合格ライン（${p}%）。分野は、試験ガイドの順に並べています。</p>`;
  };

  // src/choices.ts

  function importPack(d, fname) {
    if (!okD(d)) throw new Error("出題データの形式ではありません。");
    const name = fname.replace(/\.json$/i, "").trim() || "出題データ";
    ensureSets();
    const merged = {};
    for (const k in d.pool) {
      const ex = canonExam(k);
      const seen = new Set((merged[ex] || []).map((x) => x.q));
      const list2 = merged[ex] || (merged[ex] = []);
      (d.pool[k] || []).forEach((x) => {
        if (x && x.q && !seen.has(x.q)) {
          seen.add(x.q);
          list2.push(x);
        }
      });
    }
    let n = 0;
    for (const ex in merged) {
      const lib = S.sets[ex] || (S.sets[ex] = {});
      if (S.cs[ex] !== name) {
        if (S.cs[ex]) lib[S.cs[ex]] = S.pool[ex] || [];
        S.cs[ex] = name;
      }
      delete lib[name];
      S.pool[ex] = merged[ex];
      if (S.rg) delete S.rg[ex];
      n += merged[ex].length;
    }
    for (const k in d.exams || {}) S.exams[canonExam(k)] = d.exams[k];

  function domainPlan(exam, N) {
    if (!exam || !exam.d) return Array(N).fill("全般");
    const total = exam.d.reduce((sum, [, w]) => sum + w, 0);
    const rows = exam.d.map(([name, w]) => {
      const x = N * w / total;
      return { name, n: Math.floor(x), frac: x - Math.floor(x) };
    });
    const left = N - rows.reduce((sum, r) => sum + r.n, 0);
    rows.slice().sort((a, b) => b.frac - a.frac).slice(0, left).forEach((r) => r.n++);
    return shuffled(rows.flatMap((r) => Array(r.n).fill(r.name)));
  }

  function askC(id, msg, sub, yes) {
    const el = $("#" + id);
    el.innerHTML = `<div class="sub"><p style="margin:0 0 6px"><b>${msg}</b></p><p class="mu" style="margin:0 0 8px">${sub}</p><div class="row"><button id="${id}n">いいえ</button><button class="p" id="${id}y">はい</button></div></div>`;
    $("#" + id + "n").onclick = () => {
      el.innerHTML = "";
    };
    $("#" + id + "y").onclick = () => {
      el.innerHTML = "";
      yes();
    };
  }
  async function gen() {
    if (busy) return;
    const N = Math.max(0, (+$("#xq").value || 0) - pool().length);
    if (!N) return;
    let sm = null;
    try {
      sm = await claude.use("sample");
    } catch (e) {
    }
    if (!sm) {
      $("#gm").textContent = "この環境では問題を作成できません。";
      return;
    }
    busy = true;
    const my = ++genId;
    $("#gb").disabled = true;
    $("#gc").innerHTML = '<button id="gx" style="width:100%;margin-top:8px">中止する</button>';
    $("#gx").onclick = () => cancelGen("gm");
    const doms = domainPlan(EX[cur], N);
    let done = 0, added = 0;
    try {
      for (let i = 0; i < N; i += 10) {
        if (my !== genId) break;
        const ds = doms.slice(i, i + 10);
        $("#gm").textContent = `作成中… ${done}/${N}問`;
        const v = await sm.json(
          `Salesforce認定「${cur}」試験の練習問題を日本語でちょうど${ds.length}問作成してください。各問の分野は順に：${ds.join("、")}。公式の出題範囲と最新機能に沿ったオリジナル問題とし、実在の試験問題は再現しないこと。実務シナリオ形式を多めに。約8割は単一選択、残りは複数選択（2つまたは3つ選択）。選択肢は4〜5個で、紛らわしい誤答を含める。正解の位置は問題ごとにランダムにし、先頭に偏らせない。複数選択の問題文末尾には（2つ選択）のように明記する。解説には正解の理由と、各誤答がなぜ違うのかを簡潔に書く。解説で選択肢を指すときは、画面の表示どおり「A」「B」「C」のように英字で書き（Aが先頭の選択肢）、0・1・2などの数字は使わない。JSON配列のみを返す。各要素：{"d":分野名,"q":問題文,"o":[選択肢の文字列],"a":[正解の添字（0始まり）],"e":解説}`,
          { modelTier: "default", cache: false }
        );
        if (my !== genId) {
          return;
        }
        (Array.isArray(v) ? v : []).forEach((q2) => {
          if (q2 && typeof q2.q === "string" && Array.isArray(q2.o) && q2.o.length >= 3 && Array.isArray(q2.a) && q2.a.length && q2.a.every((n) => Number.isInteger(n) && n >= 0 && n < q2.o.length) && !pool().some((x) => x.q === q2.q)) {
            pool().push(
              shuffleChoices({
                d: q2.d || "全般",
                q: q2.q,
                o: q2.o.map(String),
                a: q2.a,
                e: String(q2.e || "")
              })
            );
            added++;
          }
        });
        done += ds.length;
        save();
        $("#gp").style.width = Math.min(100, done / N * 100) + "%";
        window.upd();
      }
      $("#gm").textContent = `${added}問を追加しました。${pool().length < +$("#xq").value ? "不足があるため、もう一度押してください。" : ""}`;
    } catch (err) {
      if (my !== genId) {
        return;
      }
      $("#gm").textContent = `作成を中断しました（${added}問追加済み）：${err && err.code === "rate_limited" ? "利用上限に達しました。時間をおいて再開してください。" : err && err.code === "not_granted" ? "許可されませんでした。" : "もう一度お試しください。"}`;
    }
    if (my === genId) {
      busy = false;
      const c = $("#gc");
      if (c) c.innerHTML = "";
    }
    window.upd();
  }
  function startQ(n) {
    const P = pool();
    if (!P.length) return;
    const qs = shuffled(P).slice(0, Math.max(1, Math.min(n || P.length, P.length))).map(present);
    Q = { qs, i: 0, a: [], sh: 0, c: 0, ex: cur, dm: {} };
    qq();
  }
  var ALL = "sfall";
  function allSaved() {
    try {
      const d = JSON.parse(localStorage.getItem(ALL) || "null"), n = pool().length;
      if (!d || d.ex !== cur || d.set !== (S.cs[cur] || "") || !Array.isArray(d.idx) || !d.idx.length || d.idx.some((v) => !Number.isInteger(v) || v < 0 || v >= n) || !(d.i >= 0 && d.i < d.idx.length))
        return null;
      return d;
    } catch (e) {
      return null;
    }
  }
  var allClear = () => {
    try {
      localStorage.removeItem(ALL);
    } catch (e) {
    }
  };
  function allSave(i) {
    try {
      localStorage.setItem(
        ALL,
        JSON.stringify({ ex: cur, set: S.cs[cur] || "", idx: Q.idx, i, c: Q.c, dm: Q.dm })
      );
    } catch (e) {
    }
  }
  function startAll(resume2) {
    const sv = resume2 ? allSaved() : null;
    let idx;
    if (sv) idx = sv.idx;
    else {
      const [a, b] = rangeOf();
      idx = [];
      for (let k = a - 1; k < b; k++) idx.push(k);
      if (S.rnd) idx = shuffled(idx);
    }
    if (!idx.length) return;
    const P = pool();
    Q = {
      qs: idx.map((k) => present(P[k])),
      idx,
      all: 1,
      i: sv ? sv.i : 0,
      a: [],
      sh: 0,
      c: sv ? sv.c : 0,
      ex: cur,
      dm: sv ? sv.dm : {}
    };
    if (!sv) allSave(0);
    qq();
  }
  function qq() {
    go("Q" + oid(Q) + "-" + Q.i);
    const x = Q.qs[Q.i], k = x.a.length, sel = Q.a;
    $("#app").innerHTML = `<div class="top"><button id="qh">終了</button><span>${Q.i + 1} / ${Q.qs.length}</span><span>正解 ${Q.c}</span></div>
 <div class="card"><p class="mu">${esc(domJa(x.d))}　${k > 1 ? k + "つ選択" : "1つ選択"}</p><p>${rich(x.q)}</p>${x.o.map((o, i) => {
      let c = "";
      if (Q.sh) c = x.a.includes(i) ? "ok" : sel.includes(i) ? "ng" : "";
      else if (sel.includes(i)) c = "sel";
      return `<div class="opt ${c}" data-i="${i}"><b>${L5[i]}</b><span>${rich(o)}</span></div>`;
    }).join("")}</div>
 ${Q.sh ? `<div class="card"><p><b style="color:var(${ok(x, sel) ? "--ok" : "--ng"})">${ok(x, sel) ? "正解" : "不正解"}</b></p><div class="ex">${rich(x.e)}</div></div><button class="p" id="qx" style="width:100%">${Q.i < Q.qs.length - 1 ? "次へ" : "結果を見る"}</button>` : `<button class="p" id="qa" style="width:100%" ${sel.length ? "" : "disabled"}>答え合わせ</button>`}`;
    if (!Q.sh)
      document.querySelectorAll(".opt").forEach(
        (d) => d.onclick = (ev) => {
          if (ev.target.closest("a")) return;
          const i = +d.dataset.i, s = Q.a;
          if (k === 1) Q.a = [i];
          else if (s.includes(i)) Q.a = s.filter((v) => v !== i);
          else if (s.length < k) s.push(i);
          qq();
        }
      );
    $("#qh").onclick = () => {
      home();
    };
    if (Q.sh)
      $("#qx").onclick = () => {
        if (Q.i < Q.qs.length - 1) {
          Q.i++;
          Q.a = [];
          Q.sh = 0;
          qq();
        } else {
          const pc = Math.round(Q.c / Q.qs.length * 100), p = (EX[Q.ex] || {}).p || 65;
          if (Q.all) {
            Q.done = 1;
            allClear();
          }
          if (!Q.done) {
            Q.done = 1;
            S.hist.push({
              t: Date.now(),
              ex: Q.ex,
              k: "q",
              pct: pc,
              cor: Q.c,
              tot: Q.qs.length,
              pass: null,
              sec: 0,
              dom: Q.dm,
              set: S.cs[Q.ex] || ""
            });
            save();
          }
          go("Qr" + oid(Q));
          $("#app").innerHTML = `<div class="hero"><div><h1>${Q.all ? "全問の結果" : "一問一答の結果"}</h1><div class="big">${pc}<small>%</small></div><p>${Q.c} / ${Q.qs.length}問正解</p></div></div><div class="card"><h2>分野ごとの正答率</h2>${dbars(Q.dm, p, domainNames(Q.ex, Q.dm), weightsOf(Q.ex))}</div><div class="row"><button id="qr">もう一度</button><button class="p" id="qh2">ホームへ</button></div>`;
          $("#qr").onclick = () => Q.all ? startAll(false) : startQ(Q.qs.length);
          $("#qh2").onclick = home;
        }
      };
    else
      $("#qa").onclick = () => {
        Q.sh = 1;
        const r = ok(x, Q.a), d = Q.dm[x.d] || (Q.dm[x.d] = [0, 0]);
        d[1]++;
        if (r) {
          Q.c++;
          d[0]++;
          clrWr(x);
        } else addWr(x);
        if (Q.all && Q.i + 1 < Q.qs.length) allSave(Q.i + 1);
        touch();
        qq();
      };
  }
  var RUN = "sfrun";
  var shown = () => R.m ? Math.round((R.end - (R.paused || Date.now())) / 1e3) : Math.round(((R.paused || Date.now()) - R.t0) / 1e3);
  var tshow = () => R.m ? fmt(shown()) : "経過 " + fmt(shown());
  function runPayload() {
    if (!R || R.done) return null;
    const left = Math.max(0, shown());
    return {
      qs: R.qs,
      ans: R.ans,
      fl: R.fl,
      i: R.i,
      m: R.m,
      p: R.p,
      ex: R.ex,
      left,
      rnd: !!R.rnd,
      ts: Date.now()
    };
  }
  function runClear() {
    try {
      localStorage.removeItem(RUN);
    } catch (e) {
    }
  }
  function runSave() {
    try {
      if (!R) return true;
      const d = runPayload();
      if (!d) {
        localStorage.removeItem(RUN);
        return true;
      }
      const v = JSON.stringify(d);
      localStorage.setItem(RUN, v);
      const ok2 = localStorage.getItem(RUN) === v;
      R.sf = ok2;
      return ok2;
    } catch (e) {
      if (R) R.sf = false;
      return false;
    }
  }
  var storeOk = () => {
    try {
      localStorage.setItem("sfprobe", "1");
      const r = localStorage.getItem("sfprobe") === "1";
      localStorage.removeItem("sfprobe");
      return r;
    } catch (e) {
      return false;
    }
  };
  addEventListener("pagehide", () => runSave());
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") runSave();
  });
  function tmr() {
    clearInterval(T);
    T = setInterval(() => {
      if (!R || R.paused) return;
      const l = shown();
      const t = $("#tm");
      if (t) t.textContent = tshow();
      R.tk = (R.tk || 0) + 1;
      if (R.tk % 3 === 0) runSave();
      if (R.m && l <= 0) finish();
    }, 1e3);
  }
  function resume(d) {
    cur = canonExam(d.ex);
    S.rnd = !!d.rnd;
    save();
    R = {
      rnd: !!d.rnd,
      qs: d.qs,
      ans: d.ans,
      fl: d.fl,
      i: d.i,
      m: d.m,
      p: d.p,
      ex: d.ex,
      t0: Date.now() - (d.m ? d.m * 60 - d.left : d.left) * 1e3,
      end: d.m ? Date.now() + d.left * 1e3 : Date.now() + 3e11,
      paused: Date.now()
    };
    tmr();
    pz(0);
  }
  function start(n, m, p) {
    const P = rangePool();
    if (!P.length) {
      $("#pc").textContent = "問題がありません。ページ下の「出題データ」で、ファイルを読み込んでください。";
      return;
    }
    const qs = (S.rnd ? shuffled(P) : P.slice()).slice(0, Math.max(1, n || 60)).map(present);
    R = {
      rnd: !!S.rnd,
      qs,
      ans: qs.map(() => []),
      fl: qs.map(() => 0),
      i: 0,
      m,
      p,
      t0: Date.now(),
      end: m ? Date.now() + m * 6e4 : Date.now() + 3e11,
      ex: cur
    };
    tmr();
    q();
  }
  function q() {
    runSave();
    go("q" + oid(R) + "-" + R.i);
    const x = R.qs[R.i], a = R.ans[R.i], k = x.a.length;
    $("#app").innerHTML = `<div class="top"><span id="tm">${tshow()}</span><span>${R.i + 1} / ${R.qs.length}</span><button id="ps" style="min-height:40px">一時停止</button></div>
 <div class="card"><p class="mu">${k > 1 ? k + "つ選択" : "1つ選択"}</p><p>${rich(x.q)}</p>${x.o.map((o, i) => `<div class="opt ${a.includes(i) ? "sel" : ""}" data-i="${i}"><b>${"ABCDE"[i]}</b><span>${rich(o)}</span></div>`).join("")}</div>
 <div class="row"><button id="pv">前へ</button><button id="fg">${R.fl[R.i] ? "フラグ解除" : "フラグ"}</button><button id="ls">一覧</button><button id="nx" class="p">次へ</button></div>`;
    document.querySelectorAll(".opt").forEach(
      (d) => d.onclick = (ev) => {
        if (ev.target.closest("a")) return;
        const i = +d.dataset.i, s = R.ans[R.i];
        if (k === 1) R.ans[R.i] = [i];
        else if (s.includes(i)) R.ans[R.i] = s.filter((v) => v !== i);
        else if (s.length < k) s.push(i);
        q();
      }
    );
    $("#pv").onclick = () => {
      if (R.i > 0) {
        R.i--;
        q();
      }
    };
    $("#nx").onclick = () => {
      if (R.i < R.qs.length - 1) {
        R.i++;
        q();
      } else list();
    };
    $("#fg").onclick = () => {
      R.fl[R.i] ^= 1;
      q();
    };
    $("#ls").onclick = list;
    $("#ps").onclick = pause;
    if (R.sf === false)
      document.querySelector(".top").insertAdjacentHTML(
        "afterend",
        '<p class="mu" style="color:var(--ng);margin:0 0 6px">この環境では途中保存ができません。ページを閉じると、試験は最初からになります。</p>'
      );
  }
  function list() {
    runSave();
    go("l" + oid(R));
    const un = R.ans.filter((a) => !a.length).length;
    $("#app").innerHTML = `<div class="top"><span id="tm">${tshow()}</span><span>未回答 ${un}問</span><button id="ps" style="min-height:40px">一時停止</button></div>
 <div class="card"><div class="grid">${R.qs.map((_, i) => `<button data-i="${i}" class="${R.ans[i].length ? "dn" : ""} ${R.fl[i] ? "fl" : ""}">${i + 1}</button>`).join("")}</div><p class="mu">青＝回答済み　橙の角＝フラグ</p></div>
 <button class="p" id="fn" style="width:100%">採点する</button>`;
    document.querySelectorAll(".grid button").forEach(
      (b) => b.onclick = () => {
        R.i = +b.dataset.i;
        q();
      }
    );
    $("#fn").onclick = finish;
    $("#ps").onclick = pause;
  }
  function pause() {
    if (!R || R.paused) return;
    R.paused = Date.now();
    runSave();
    pz(0);
  }
  function pz(c) {
    go("p" + oid(R) + c);
    $("#app").innerHTML = `<h1>一時停止中</h1><div class="card"><p class="mu">${R.m ? "残り時間" : "経過時間"}</p><div class="big">${fmt(shown())}</div><p class="mu">再開するまで、時間は止まります。</p></div>${c ? `<div class="card"><p>試験をやめると、この試験の結果は記録されません。</p><div class="row"><button id="pn">戻る</button><button id="py" style="color:var(--ng);border-color:var(--ng)">やめてホームへ</button></div></div>` : `<div class="row"><button id="pq">試験をやめる</button><button class="p" id="pr">再開する</button></div>`}`;
    if (c) {
      $("#pn").onclick = () => pz(0);
      $("#py").onclick = () => {
        clearInterval(T);
        R = null;
        runClear();
        home();
      };
    } else {
      $("#pq").onclick = () => pz(1);
      $("#pr").onclick = () => {
        R.end += Date.now() - R.paused;
        if (!R.m) R.t0 += Date.now() - R.paused;
        R.paused = 0;
        q();
      };
    }
  }
  var ok = (x, a) => a.length === x.a.length && x.a.every((v) => a.includes(v));
  var MAX_DET = 20;
  var histAll = false;
  function finish() {
    if (!R || R.done) return;
    R.done = 1;
    clearInterval(T);
    runSave();
    const el = Math.round((Date.now() - R.t0) / 1e3), sec = R.m ? Math.min(R.m * 60, el) : el, dm = {};
    let c = 0;
    R.qs.forEach((x, i) => {
      const r = ok(x, R.ans[i]);
      c += r ? 1 : 0;
      const d = dm[x.d] || (dm[x.d] = [0, 0]);
      d[1]++;
      d[0] += r ? 1 : 0;
      if (r) clrWr(x);
      else addWr(x);
    });
    const pct = Math.round(c / R.qs.length * 100), pass = pct >= R.p;
    S.hist.push({
      t: Date.now(),
      ex: R.ex,
      pct,
      cor: c,
      tot: R.qs.length,
      pass,
      sec,
      dom: dm,
      set: S.cs[R.ex] || "",
      // あとで見返せるように、問題・解説・自分の答えをそのまま残す（新しい MAX_DET 回分まで）
      det: { qs: R.qs.map((x) => ({ ...x })), ans: R.ans.map((a) => a.slice()), p: R.p }
    });
    S.hist.filter((h) => h.det).slice(0, -MAX_DET).forEach((h) => delete h.det);
    touch();
    save();
    R.dm = dm;
    R.pct = pct;
    R.pass = pass;
    R.c = c;
    R.sec = sec;
    res(false);
  }
  function res(w, V = R) {
    const L = V.qs.map((x, i) => [x, i]).filter(([x, i]) => !w || !ok(x, V.ans[i]));
    $("#app").innerHTML = `<div class="hero"><div><h1>結果 <span class="pill">${V.pass ? "合格" : "不合格"}</span></h1><div class="big">${V.pct}<small>%</small></div><p>${V.t ? new Date(V.t).toLocaleDateString("ja-JP") + "　" : ""}${V.c} / ${V.qs.length}問正解　合格ライン ${V.p}%　所要時間 ${fmt(V.sec)}</p></div></div>
 <div class="card"><h2>分野ごとの正答率</h2>${dbars(V.dm, V.p, domainNames(V.ex, V.dm), weightsOf(V.ex))}</div>
 <div class="row"><button id="wg">${w ? "すべて表示" : "間違いのみ表示"}</button><button id="hm" class="p">ホームへ</button></div>
 ${L.map(([x, i]) => `<div class="card"><p class="mu">問${i + 1}　${esc(domJa(x.d))}　${ok(x, V.ans[i]) ? "正解" : "不正解"}</p><p>${rich(x.q)}</p>${x.o.map((o, j) => `<div class="opt ${x.a.includes(j) ? "ok" : V.ans[i].includes(j) ? "ng" : ""}"><b>${L5[j]}</b><span>${rich(o)}${V.ans[i].includes(j) ? "　←あなたの回答" : ""}</span></div>`).join("")}<div class="ex">${rich(x.e)}</div></div>`).join("")}`;
    $("#wg").onclick = () => res(!w, V);
    $("#hm").onclick = home;
    window.scrollTo(0, 0);
  }
  function viewResult(h) {
    const V = {
      t: h.t,
      ex: h.ex,
      qs: h.det.qs,
      ans: h.det.ans,
      p: h.det.p,
      pct: h.pct,
      pass: h.pass,
      c: h.cor,
      sec: h.sec,
      dm: h.dom || {}
    };
    res(false, V);
  }
  (async () => {
    if (!document.querySelector('meta[name="viewport"]')) {
      const m = document.createElement("meta");
      m.name = "viewport";
      m.content = "width=device-width, initial-scale=1, viewport-fit=cover";
      document.head.appendChild(m);
    }
    syncEx();
    try {
      navigator.storage?.persist?.();
    } catch (e) {
    }
    home();
  })();
})();

</script>
